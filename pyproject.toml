[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prodockit"
version = "0.17.0"
description = "A family of extensions for Zensical needed for professional and academic documentation: section cross-references, bibliography/citation handling, a glossary, a back-of-book index, a Pandoc/WeasyPrint PDF pipeline, Jinja macros for word counts and reference-style spacing, and repo-metadata syncing"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Mark Buckwell" },
]
requires-python = ">=3.10"
keywords = ["markdown", "python-markdown", "zensical", "extension", "pdf", "pandoc"]
dependencies = [
  "Markdown>=3.4",
  "zensical",
  "beautifulsoup4>=4.12",
  "click>=8.0",
  "pypdf>=4.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  # Kept in step with requires-python above and ci.yml's test matrix - these
  # are what PyPI shows in its sidebar, and `Programming Language :: Python
  # :: 3` alone told a reader nothing about which 3.x actually work.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/buckwem/prodockit-extensions"
Documentation = "https://buckwem.github.io/prodockit-extensions/"
Issues = "https://github.com/buckwem/prodockit-extensions/issues"

[project.entry-points."markdown.extensions"]
"prodockit.headings" = "prodockit.headings:HeadingsExtension"
"prodockit.refs" = "prodockit.refs:RefsExtension"
"prodockit.citations" = "prodockit.citations:CitationsExtension"
"prodockit.glossary" = "prodockit.glossary:GlossaryExtension"
"prodockit.tables" = "prodockit.tables:TablesExtension"
"prodockit.bibliography" = "prodockit.bibliography:BibliographyExtension"
"prodockit.index" = "prodockit.index:IndexExtension"

[project.scripts]
prodockit = "prodockit.cli:main"

[project.optional-dependencies]
dev = [
  "ruff",
  "mypy",
  "types-Markdown",
  "types-beautifulsoup4",
  "pytest",
  "pytest-cov",
  "pymupdf>=1.24",
]
# Only needed for prodockit.pdf.index's own back-of-book index (pdf_include_index) -
# a real Python import (not shelled out to, unlike pandoc/weasyprint), and a
# sizeable one, so it's kept optional rather than a hard dependency every
# prodockit install pays for regardless of whether this feature is ever used.
index = [
  "pymupdf>=1.24",
]
# Only needed to use prodockit.testing - the pytest fixtures and checks a
# consuming project can point at its own built site/PDF. The plugin itself
# imports nothing heavy at module scope, so a project that installs
# prodockit without this extra is unaffected even though pytest still
# discovers the plugin.
testing = [
  "pytest>=7.0",
  "pymupdf>=1.24",
  "tomli>=2.0; python_version < '3.11'",
]

# Makes the prodockit_* fixtures available without any conftest.py wiring.
# See prodockit.testing.plugin for why it is safe to load everywhere.
[project.entry-points.pytest11]
prodockit = "prodockit.testing.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/prodockit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked `built` inspect this project's own built site and PDF, which
# only exist after `prodockit pdf` and `zensical build` have run. They are
# excluded by default so the ordinary unit run needs no build, and are run
# explicitly by docs.yml after it builds. Deselecting rather than skipping,
# so an unbuilt checkout doesn't report a silent pass.
addopts = "-m 'not built'"
markers = [
  "built: needs this project's own built site/PDF on disk (run by docs.yml)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# En dash is deliberate - prodockit.pdf.index's own back-of-book page-range
# formatting ("67–70"), not a stray look-alike for a hyphen-minus.
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
# One CSS/Lua rule (or descriptive test name) per source line - wrapping
# would fragment the generated content's own readability for no benefit.
"src/prodockit/pdf/css.py" = ["E501"]
"src/prodockit/pdf/lua.py" = ["E501"]
"src/prodockit/zensical_macros.py" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
