[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prodockit"
version = "0.33.0"
description = "A family of extensions for Zensical needed for professional and academic documentation: section cross-references, bibliography/citation handling, a glossary, a back-of-book index, a Pandoc/WeasyPrint PDF pipeline, Jinja macros for word counts and reference-style spacing, repo-metadata syncing, build-input version pinning, and machine setup automation"
readme = "README.md"
license = "MIT"
authors = [
  { name = "Mark Buckwell" },
]
requires-python = ">=3.10"
keywords = ["markdown", "python-markdown", "zensical", "extension", "pdf", "pandoc"]
dependencies = [
  # Raised from 3.4 to match the version docs.yml pins, following the same
  # convention as `zensical` below: the floor names the version this is
  # developed and built against, and the build pins that same number
  # exactly. Older releases are not known to break - this is "what it is
  # tested on", not "what it needs" - but leaving the two numbers apart
  # makes `prodockit pins --check` report the package as declared
  # inconsistently on every run, since that tool models one version per
  # package with the operator varying per site (prodockit-extensions#178).
  "Markdown>=3.10.3",
  # A floor, not an exact pin: prodockit is a library, and `==` here would
  # propagate to every consumer and hard-conflict with any project needing a
  # different Zensical.
  #
  # 0.0.53 is the version this is developed and built against, not a minimum
  # below which anything breaks - 0.0.50 through 0.0.52 all work. It is recorded
  # because Zensical is pre-1.0 and prodockit reaches well past its public
  # surface (the config loader, the per-page render context prodockit.
  # headings detects, the icon set prodockit.pdf.icons resolves against), so
  # which version was used is worth knowing when output changes.
  #
  # Be clear about what this does *not* buy: a floor still resolves to
  # whatever is newest, so the published site can still change with nothing
  # committed. 0.0.52 silently redrew the GitHub brand icon (Font Awesome
  # 7.2.0 -> 7.3.1) on every page. Reproducibility needs a pin on the
  # *build* side - a constraint in docs.yml - not in library metadata.
  "zensical>=0.0.53",
  # No pymdown-extensions entry here, deliberately. prodockit never imports
  # it - it only matches the class shapes pymdownx emits, from a stylesheet
  # and a Lua filter, on documents a project chose to render with it. A
  # project using none of those extensions should not be made to install it.
  # The build pins it in docs.yml instead, where reproducibility of this
  # project's own published output is the concern
  # (prodockit-extensions#178).
  #
  # Markdown itself is declared at the top of this list, and is a direct
  # import rather than a transitive convenience.
  "beautifulsoup4>=4.12",
  "click>=8.0",
  "pypdf>=4.0",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  # Kept in step with requires-python above and ci.yml's test matrix - these
  # are what PyPI shows in its sidebar, and `Programming Language :: Python
  # :: 3` alone told a reader nothing about which 3.x actually work.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/buckwem/prodockit-extensions"
Documentation = "https://buckwem.github.io/prodockit-extensions/"
Issues = "https://github.com/buckwem/prodockit-extensions/issues"

[project.entry-points."markdown.extensions"]
"prodockit.headings" = "prodockit.headings:HeadingsExtension"
"prodockit.refs" = "prodockit.refs:RefsExtension"
"prodockit.citations" = "prodockit.citations:CitationsExtension"
"prodockit.glossary" = "prodockit.glossary:GlossaryExtension"
"prodockit.tables" = "prodockit.tables:TablesExtension"
"prodockit.bibliography" = "prodockit.bibliography:BibliographyExtension"
"prodockit.index" = "prodockit.index:IndexExtension"

[project.scripts]
prodockit = "prodockit.cli:main"
# The same tool under a shorter name. Every command here is typed at a
# prompt, often several times over while a setup is being repaired -
# `pdk bootstrap --apply` beats `prodockit bootstrap --apply` by nine
# characters each time. Both names stay: scripts and documentation
# written against `prodockit` keep working, and click takes the program
# name from argv, so the help text says whichever one was typed.
pdk = "prodockit.cli:main"

[project.optional-dependencies]
dev = [
  "ruff",
  "mypy",
  "types-Markdown",
  "types-beautifulsoup4",
  "pytest",
  "pytest-cov",
  "pymupdf>=1.24",
]
# Only needed for prodockit.pdf.index's own back-of-book index (pdf_include_index) -
# a real Python import (not shelled out to, unlike pandoc/weasyprint), and a
# sizeable one, so it's kept optional rather than a hard dependency every
# prodockit install pays for regardless of whether this feature is ever used.
index = [
  "pymupdf>=1.24",
]
# Only needed to use prodockit.testing - the pytest fixtures and checks a
# consuming project can point at its own built site/PDF. The plugin itself
# imports nothing heavy at module scope, so a project that installs
# prodockit without this extra is unaffected even though pytest still
# discovers the plugin.
testing = [
  "pytest>=7.0",
  "pymupdf>=1.24",
  "tomli>=2.0; python_version < '3.11'",
]

# Makes the prodockit_* fixtures available without any conftest.py wiring.
# See prodockit.testing.plugin for why it is safe to load everywhere.
[project.entry-points.pytest11]
prodockit = "prodockit.testing.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/prodockit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked `built` inspect this project's own built site and PDF, which
# only exist after `prodockit pdf` and `zensical build` have run. They are
# excluded by default so the ordinary unit run needs no build, and are run
# explicitly by docs.yml after it builds. Deselecting rather than skipping,
# so an unbuilt checkout doesn't report a silent pass.
addopts = "-m 'not built'"
markers = [
  "built: needs this project's own built site/PDF on disk (run by docs.yml)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# En dash is deliberate - prodockit.pdf.index's own back-of-book page-range
# formatting ("67–70"), not a stray look-alike for a hyphen-minus.
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
# One CSS/Lua rule (or descriptive test name) per source line - wrapping
# would fragment the generated content's own readability for no benefit.
"src/prodockit/pdf/css.py" = ["E501"]
"src/prodockit/pdf/lua.py" = ["E501"]
"src/prodockit/zensical_macros.py" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
