name: Documentation
on:
  push:
    branches:
      - main
  # Also redeploy whenever a release is published. The cover page's
  # "Release: <tag>" line comes from `git describe --tags --abbrev=0`, so it
  # can only ever show a tag that already exists at build time - and in the
  # normal flow the version-bump commit is pushed (triggering the deploy
  # above) *before* the release and its tag are created. Without this
  # trigger, the site and PDF sit one release behind until something else
  # happens to redeploy them, which is exactly what needed fixing by hand
  # after 0.11.1 and again after 0.12.0.
  #
  # A release event runs against refs/tags/<tag>, not a branch, so this also
  # needed a matching `tag: prodockit-v*` entry alongside `branch: main` in
  # the github-pages environment's deployment branch policies - without it
  # the run is rejected at the environment gate rather than deploying.
  release:
    types: [published]
  workflow_dispatch:

# Publishing a release right after merging its version bump starts two
# deploys at once - one for the push, one for the release - and without a
# concurrency group they race. That happened on 0.15.1: the push run had
# checked out `main` before the tag existed, so its build saw the *previous*
# tag, and its deployment is the one that ended up live, even though the
# release run started later, finished later, and reported success. The site
# sat on the old release number until a manual redeploy.
#
# `cancel-in-progress: false` rather than true: a queued deploy should wait
# and then supersede, not be thrown away. GitHub's own Pages starter
# workflow uses this same pairing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    # Consumed by the verify job below.
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      index_sha: ${{ steps.fingerprint.outputs.index_sha }}
    env:
      # mermaid-cli drives Chrome through Puppeteer to rasterise diagrams.
      # Point it at the apt-installed Chrome below rather than letting
      # Puppeteer download its own, and skip that download entirely.
      #
      # PUPPETEER_SKIP_DOWNLOAD, not the older
      # PUPPETEER_SKIP_CHROMIUM_DOWNLOAD - Puppeteer renamed it, and
      # mermaid-cli ^11.4.2 resolves to puppeteer 25.x, which only honours
      # the new name. Under the old name the skip silently does nothing and
      # a full Chrome build is downloaded on every run.
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
        with:
          # actions/checkout's default shallow clone (fetch-depth: 1) fetches
          # no tags at all, so prodockit.zensical_macros' {{ release }}
          # variable (git describe --tags --abbrev=0) always returned ""
          # here - the cover page's "Release: ..." line silently never
          # appeared on the deployed site/PDF, even though it worked in any
          # full local checkout. Full history needed so the nearest tag
          # reachable from HEAD is actually present to describe.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y pandoc fonts-inter fonts-jetbrains-mono
      # mermaid-cli, so the ```mermaid diagram in extensions/bibliography.md
      # is pre-rendered to a static SVG for the PDF - WeasyPrint has no JS
      # engine to run Mermaid.js the way the live site does, and without
      # this the PDF shows raw `flowchart LR ...` source instead.
      - run: curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor | sudo tee /usr/share/keyrings/google-chrome.gpg > /dev/null
      - run: echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
      - run: sudo apt-get update && sudo apt-get install -y google-chrome-stable
      - run: npm ci --prefix tools/mermaid
      # The [testing] extra brings pytest/pymupdf for the built-output
      # checks below. pymupdf is also what extra.pdf_include_index needs to
      # read page numbers back out of the first pass, so this one install
      # covers both - no separate [index] extra needed here.
      - run: pip install -e ".[testing]" weasyprint
      # Two pandoc+WeasyPrint passes, not one: extra.pdf_include_index is on
      # in zensical.toml, and the back-of-book index can only be built once
      # WeasyPrint has laid the document out (see prodockit.pdf.index). The
      # single-page builds below stay single-pass - build_pdf() skips the
      # second pass for a document with no \index{} markers, and the only
      # live markers in these docs are in extensions/index-terms.md, which
      # has no single-page build of its own.
      - run: prodockit pdf
      - run: prodockit pdf -m introduction.md
      - run: prodockit pdf -m installation.md
      - run: prodockit pdf -m extensions/headings.md
      - run: prodockit pdf -m extensions/refs.md
      - run: prodockit pdf -m extensions/citations.md
      - run: prodockit pdf -m extensions/glossary.md
      - run: prodockit pdf -m extensions/tables.md
      - run: prodockit pdf -m extensions/bibliography.md
      - run: prodockit pdf -m pdf.md
      - run: prodockit pdf -m macros.md
      - run: prodockit pdf -m about/changelog.md
      - run: prodockit pdf -m about/license.md
      - run: zensical build --clean --strict
      # Checks what the builds above actually produced, using this project's
      # own pytest plugin - deselected from the normal unit run, which needs
      # no build. Catches a Mermaid diagram or formula reaching the PDF as
      # raw source, and a nav page missing from the site, before either is
      # published (see tests/test_built_docs.py).
      - run: python -m pytest tests/test_built_docs.py -m built -v
      # Fingerprint what we are about to publish, so the verify job below can
      # tell whether the live site is actually serving *this* build. Taken
      # from the same directory upload-pages-artifact packs, immediately
      # before it packs it.
      - id: fingerprint
        run: echo "index_sha=$(sha256sum site/index.html | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment

  # A successful deploy does not mean the site serves it. Three of the four
  # releases up to 0.17.1 published fine and then kept serving the previous
  # build - deployment reported `success`, the superseded one reported
  # `inactive`, and the origin carried on returning the old bytes until
  # someone noticed and re-ran this workflow by hand. Nothing in the run
  # itself was wrong, so nothing went red.
  #
  # This closes that gap: compare the live page against the fingerprint of
  # the build we just uploaded, and fail the run if they never converge.
  # Separate job rather than another step, so the deploy itself is never
  # gated on delivery - the artifact is published either way, and this only
  # decides whether the run reports success.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      # Pages serves `cache-control: max-age=600`, so up to ~10 minutes of
      # staleness is normal and expected rather than a fault. 15 minutes of
      # polling clears that window with room to spare; past it, every
      # occurrence so far has needed a manual redeploy. A `?cb=` query buster
      # would not help - the CDN normalises query strings - so this waits the
      # TTL out rather than trying to defeat it.
      - name: Verify the live site serves this build
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          WANT: ${{ needs.deploy.outputs.index_sha }}
        run: |
          set -u
          for attempt in $(seq 1 30); do
            # Download to a file rather than piping or capturing. Piping into
            # sha256sum reports the *pipe's* exit status, so a failed fetch
            # silently hashes empty input instead of being noticed; capturing
            # the body in $(...) strips its trailing newline, so the hash
            # would never match the file on disk.
            if curl -fsSL --max-time 30 -o live-index.html "$PAGE_URL"; then
              got=$(sha256sum live-index.html | cut -d' ' -f1)
            else
              got="fetch-failed"
            fi
            if [ "$got" = "$WANT" ]; then
              echo "Live after ~$(( (attempt - 1) * 30 ))s: $PAGE_URL is serving this build."
              exit 0
            fi
            echo "attempt $attempt/30: live index.html is $got, want $WANT"
            sleep 30
          done
          # One line: a ::error:: annotation is terminated by the newline, and
          # a backslash continuation would fold this block's own indentation
          # into the message as runs of spaces.
          echo "::error::$PAGE_URL is not serving this build after 15 minutes. The deploy succeeded but delivery did not - this has happened on most releases so far. Re-run with: gh workflow run docs.yml --ref main"
          echo "Live page headers for diagnosis (last-modified predating this run means the old build is still being served):"
          curl -sI "$PAGE_URL" | grep -iE 'last-modified|etag|age' || true
          exit 1
