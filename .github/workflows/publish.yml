name: Publish to PyPI
on:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      # Twine is deliberately a release-only dependency. Pinning the reviewed
      # validator makes a change to PyPI's rendering gate explicit rather than
      # inheriting a new checker on the day a release is published (#518).
      - run: pip install build "twine==7.0.0"
      - run: python -m build
      - name: Validate the wheel, source distribution and PyPI README
        run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    # Waits on PyPI, so a wider margin than the rest.
    timeout-minutes: 20
    permissions:
      id-token: write # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
