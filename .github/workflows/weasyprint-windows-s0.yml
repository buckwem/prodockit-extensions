name: WeasyPrint Windows G3 acceptance
on:
  pull_request:
    paths:
      - .github/workflows/weasyprint-windows-s0.yml
      - src/prodockit/pdf/build.py
      - src/prodockit/pdf/config.py
      - src/prodockit/pdf/font_runtime.py
      - src/prodockit/pdf/pandoc_runtime.py
      - src/prodockit/pdf/runtime_download.py
      - src/prodockit/pdf/runtime_prepare.py
      - src/prodockit/pdf/runtime_store.py
      - src/prodockit/pdf/source_bundle.py
      - src/prodockit/pdf/weasyprint_runtime.py
      - tests/test_pdf_weasyprint_runtime.py
      - tools/weasyprint_windows_s0.py
      - tests/test_weasyprint_windows_s0.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  official-onedir:
    name: Official onedir on Windows x64
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          architecture: x64
          cache: pip
      - name: Install the PDF inspection dependency
        run: python -m pip install "pypdf>=4,<7"
      - name: Run the isolated S0 acceptance harness
        run: >-
          python tools/weasyprint_windows_s0.py
          --work-dir weasyprint-s0-work
          --report weasyprint-windows-s0.json
      - name: Install the candidate
        run: python -m pip install -e ".[testing]" "zensical==0.0.61"
      - name: Build the completed website
        run: zensical build --clean --strict
      - name: Exercise cold and warm production preparation
        shell: pwsh
        run: |
          $cold = Measure-Command { pdk pdf --prepare pandoc --prepare fonts --prepare weasyprint }
          $warm = Measure-Command { pdk pdf --prepare pandoc --prepare fonts --prepare weasyprint }
          @{
            cold_seconds = $cold.TotalSeconds
            warm_seconds = $warm.TotalSeconds
          } | ConvertTo-Json | Set-Content weasyprint-windows-g3-timings.json
      - name: Exercise the Pandoc handoff and direct source-bundle path
        run: |
          pdk pdf --markdown-file gettingstarted.md
          pdk source-bundle
      - name: Verify both production PDFs
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from pypdf import PdfReader

          outputs = (Path("docs/gettingstarted.pdf"), Path("docs/source_bundle.pdf"))
          for output in outputs:
              assert output.read_bytes().startswith(b"%PDF"), output
              reader = PdfReader(output)
              assert len(reader.pages) >= 1, output
              assert any((page.extract_text() or "").strip() for page in reader.pages), output
          '@ | python -
      - name: Keep the evidence report and rendered fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weasyprint-windows-x64-s0
          path: |
            weasyprint-windows-s0.json
            weasyprint-windows-g3-timings.json
            weasyprint-s0-work/outputs/*.pdf
            docs/gettingstarted.pdf
            docs/source_bundle.pdf
          if-no-files-found: warn
