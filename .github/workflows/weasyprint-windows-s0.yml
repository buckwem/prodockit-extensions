name: WeasyPrint Windows S0 evidence
on:
  pull_request:
    paths:
      - .github/workflows/weasyprint-windows-s0.yml
      - tools/weasyprint_windows_s0.py
      - tests/test_weasyprint_windows_s0.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  official-onedir:
    name: Official onedir on Windows x64
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          architecture: x64
          cache: pip
      - name: Install the PDF inspection dependency
        run: python -m pip install "pypdf>=4,<7"
      - name: Run the isolated S0 acceptance harness
        run: >-
          python tools/weasyprint_windows_s0.py
          --work-dir weasyprint-s0-work
          --report weasyprint-windows-s0.json
      - name: Keep the evidence report and rendered fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weasyprint-windows-x64-s0
          path: |
            weasyprint-windows-s0.json
            weasyprint-s0-work/outputs/*.pdf
          if-no-files-found: warn
