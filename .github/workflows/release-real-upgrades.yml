name: Release real upgrades
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      adopt: ${{ steps.scope.outputs['adopt-native'] }}
      bootstrap: ${{ steps.scope.outputs['bootstrap-native'] }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scope
        name: Select release-grade upgrade tests
        run: python tools/ci_scope.py --github-event >> "$GITHUB_OUTPUT"

  bootstrap-upgrade:
    needs: scope
    if: needs.scope.outputs.bootstrap == 'true'
    name: Bootstrap upgrade — ${{ matrix.name }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            runner: ubuntu-24.04
            architecture: x64
            architecture_check: --require-x64
          - name: Ubuntu 24.04
            runner: ubuntu-24.04-arm
            architecture: arm64
            architecture_check: --require-arm64
          - name: Windows 2025
            runner: windows-2025
            architecture: x64
            architecture_check: --require-x64
          - name: Windows 11
            runner: windows-11-arm
            architecture: arm64
            architecture_check: --require-arm64
          - name: macOS 15
            runner: macos-15
            architecture: arm64
            architecture_check: --require-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build and install the candidate wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('dist').glob('prodockit-*.whl')); subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', str(wheel)], check=True)"
      - name: Upgrade real old software through the Surrey and GitHub routes
        run: >-
          python tools/bootstrap_native_upgrade.py
          --wheel dist
          ${{ matrix.architecture_check }}
          --report bootstrap-native-upgrade-report.json
      - name: Keep the Bootstrap upgrade report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-upgrade-${{ matrix.runner }}-${{ matrix.architecture }}
          path: bootstrap-native-upgrade-report.json
          if-no-files-found: warn

  adopt-upgrade:
    needs: scope
    if: needs.scope.outputs.adopt == 'true'
    name: Adopt upgrade — ${{ matrix.name }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            runner: ubuntu-24.04
            architecture: x64
            architecture_check: --require-x64
          - name: Ubuntu 24.04
            runner: ubuntu-24.04-arm
            architecture: arm64
            architecture_check: --require-arm64
          - name: Windows 2025
            runner: windows-2025
            architecture: x64
            architecture_check: --require-x64
          - name: Windows 11
            runner: windows-11-arm
            architecture: arm64
            architecture_check: --require-arm64
          - name: macOS 15
            runner: macos-15
            architecture: arm64
            architecture_check: --require-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            src/prodockit/_tools_template/mermaid/package-lock.json
            src/prodockit/_tools_template/mathjax/package-lock.json
      - name: Build the candidate wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Upgrade a fully adopted project from an older release
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: >-
          python tools/adopt_native_upgrade.py
          --wheel dist
          ${{ matrix.architecture_check }}
          --report adopt-native-upgrade-report.json
      - name: Keep the Adopt upgrade report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adopt-upgrade-${{ matrix.runner }}-${{ matrix.architecture }}
          path: adopt-native-upgrade-report.json
          if-no-files-found: warn

  result:
    name: Release real-upgrade result
    if: always()
    needs: [scope, bootstrap-upgrade, adopt-upgrade]
    runs-on: ubuntu-24.04
    steps:
      - name: Report the selected scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          BOOTSTRAP_SELECTED: ${{ needs.scope.outputs.bootstrap }}
          ADOPT_SELECTED: ${{ needs.scope.outputs.adopt }}
          BOOTSTRAP_RESULT: ${{ needs.bootstrap-upgrade.result }}
          ADOPT_RESULT: ${{ needs.adopt-upgrade.result }}
        run: |
          if [ "$SCOPE_RESULT" != success ]; then
            echo "The changed-file classifier failed."
            exit 1
          fi
          if [ "$BOOTSTRAP_SELECTED" = true ] && [ "$BOOTSTRAP_RESULT" != success ]; then
            echo "The Bootstrap real-upgrade matrix did not pass."
            exit 1
          fi
          if [ "$ADOPT_SELECTED" = true ] && [ "$ADOPT_RESULT" != success ]; then
            echo "The Adopt real-upgrade matrix did not pass."
            exit 1
          fi
          if [ "$BOOTSTRAP_SELECTED" != true ] && [ "$ADOPT_SELECTED" != true ]; then
            echo "No release-grade real-upgrade matrix was selected."
          fi
