# docs.yml and ci.yml pin `zensical` and `weasyprint` exactly, so the
# published site and PDF only change when someone decides they should. The
# cost of pinning is going quietly stale: nothing says a newer release
# exists, or what it would do to the output.
#
# This closes that. Weekly, it builds the docs twice in one job - once with
# the pinned versions, once with the newest - and diffs the results byte for
# byte. If an upgrade would change the published output, or break the
# built-output tests, it opens an issue saying exactly what moved.
#
# The diff is meaningful because the builds are deterministic: two builds of
# identical inputs produce byte-identical `site/` and PDF (verified when the
# pins were introduced). Build Zensical first: `prodockit pdf` consumes that
# completed output and atomically adds the PDF to it.
#
# Reports rather than fails: a newer release is information, not a broken
# build, and a red cross on a schedule is noise nobody reads.
name: Dependency drift

on:
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# The runner image's own `pandoc` package lags well behind upstream -
# `ubuntu-24.04` currently ships 3.1.3, while a contributor on macOS or
# Windows has whatever Homebrew or winget last gave them. That gap is not
# cosmetic: pandoc 3.1.3 accepted `<pre><code>` containing element markup
# as a code block and 3.10 does not, so every fenced code block in the PDF
# reflowed as justified prose on a current pandoc while CI kept publishing
# perfect output (prodockit-extensions#207). CI could not see the bug, and
# would have started producing it unannounced at the next image bump.
#
# Pinning an upstream release keeps CI and local development on one
# version, and makes a pandoc change an explicit commit rather than a
# silent inheritance.
#
# prodockit-template pins the same way and currently says 3.10; it and
# prodockit-userguide's .gitlab-ci.yml both need bringing to this number,
# so the family builds its PDFs with one pandoc rather than three
# (prodockit-extensions#209).
env:
  PANDOC_VERSION: "3.10.1"

jobs:
  drift:
    runs-on: ubuntu-24.04
    # Around two and a half minutes, and unattended on a schedule -
    # the run nobody is watching is the one that must not hang (#478).
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
    steps:
      - uses: actions/checkout@v5
        with:
          # Same reason as docs.yml: the cover page's release line comes
          # from `git describe --tags`, and a shallow clone has no tags. A
          # missing release line would otherwise show up as a spurious diff.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The image's mirrorlist puts `azure.archive.ubuntu.com` first. When
      # that host is down - it was, repeatedly, on 2026-08-18 - apt spends
      # minutes on it before reaching the `archive.ubuntu.com` fallback,
      # which answers in milliseconds throughout. Neither a shorter
      # connect timeout nor fewer retries reached it in reasonable time,
      # so the dead host is taken out of the list instead (#478).
      #
      # Reported rather than assumed: if the image stops shipping a
      # mirrorlist, or stops using Azure, the run says so and carries on
      # unchanged - a substitution that quietly matched nothing would be
      # worse than either.
      - name: Point apt at a mirror that answers
        timeout-minutes: 2
        run: |
          list=/etc/apt/apt-mirrors.txt
          if [ ! -f "$list" ]; then
            echo "::notice::no $list in this image - apt left as it is"
          elif ! grep -q 'azure.archive.ubuntu.com' "$list"; then
            echo "::notice::$list no longer names Azure - apt left as it is"
          else
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$list"
            echo "mirrorlist now:"; cat "$list"
          fi
      # A mirror that stalls must fail fast, not hold the runner: this
      # step takes seconds, and once sat 35 minutes (#478).
      #
      # The image lists `azure.archive.ubuntu.com` first and
      # `https://archive.ubuntu.com` as a fallback. When the first is
      # dead the fallback works - but apt waits out a 120-second connect
      # timeout per source before trying it, four sources deep. Ten
      # seconds is far above a healthy mirror's response and reaches the
      # fallback in a fraction of the time.
      #
      # Retries are deliberately not raised: they re-ask the dead mirror
      # rather than moving on, which is what exhausted the budget when
      # this was first tried.
      - run: sudo apt-get -o Acquire::http::Timeout=10 update && sudo apt-get -o Acquire::http::Timeout=10 install -y curl fonts-inter fonts-jetbrains-mono
        timeout-minutes: 8
      # Upstream release rather than the image's package - see PANDOC_VERSION.
      #
      # Cached because the release CDN is the single most fragile thing in
      # this job: it returned 503 for hours one evening and failed every
      # run in the matrix before a single test executed. The key carries
      # the version, so a bump fetches afresh and an unchanged pin never
      # touches the network again.
      - id: pandoc-cache
        uses: actions/cache@v4
        with:
          path: /tmp/pandoc.deb
          key: pandoc-${{ env.PANDOC_VERSION }}-amd64-deb
      # The retry stays for the first run on a new key, and for the day
      # the cache is evicted - a cache is a saving, not a guarantee.
      - if: steps.pandoc-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 -o /tmp/pandoc.deb "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
      - run: sudo apt install -y /tmp/pandoc.deb
      - run: curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor | sudo tee /usr/share/keyrings/google-chrome.gpg > /dev/null
      - run: echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
      # A mirror that stalls must fail fast, not hold the runner: this
      # step takes seconds, and once sat 35 minutes (#478).
      #
      # The image lists `azure.archive.ubuntu.com` first and
      # `https://archive.ubuntu.com` as a fallback. When the first is
      # dead the fallback works - but apt waits out a 120-second connect
      # timeout per source before trying it, four sources deep. Ten
      # seconds is far above a healthy mirror's response and reaches the
      # fallback in a fraction of the time.
      #
      # Retries are deliberately not raised: they re-ask the dead mirror
      # rather than moving on, which is what exhausted the budget when
      # this was first tried.
      - run: sudo apt-get -o Acquire::http::Timeout=10 update && sudo apt-get -o Acquire::http::Timeout=10 install -y google-chrome-stable
        timeout-minutes: 8
      - run: npm ci --prefix tools/mermaid
      - run: npm ci --prefix tools/mathjax

      # Keep these in step with docs.yml's own install line - including
      # Markdown and pymdown-extensions, which are transitive under zensical
      # and unpinned by it (prodockit-extensions#178). Without them here,
      # both halves of the comparison below would install whatever pip finds
      # newest, so a pymdownx release that changed the rendered HTML would
      # appear in *both* builds and diff to nothing - the one drift this job
      # exists to catch would be the one it could not see.
      - name: Build with the pinned versions
        run: |
          pip install -e ".[testing]" "zensical==0.0.57" "weasyprint==69.0" "Markdown==3.10.3" "pymdown-extensions==11.0.2"
          zensical build --clean --strict
          prodockit pdf
          prodockit update-dates
          mkdir -p /tmp/pinned
          cp -R site /tmp/pinned/site
          cp docs/site_documentation.pdf /tmp/pinned/doc.pdf
          {
            echo "pinned_zensical=$(pip show zensical | awk '/^Version:/{print $2}')"
            echo "pinned_weasyprint=$(pip show weasyprint | awk '/^Version:/{print $2}')"
            echo "pinned_markdown=$(pip show markdown | awk '/^Version:/{print $2}')"
            echo "pinned_pymdownx=$(pip show pymdown-extensions | awk '/^Version:/{print $2}')"
          } >> "$GITHUB_ENV"

      - name: Build with the newest versions
        run: |
          pip install -qU zensical weasyprint Markdown pymdown-extensions
          zensical build --clean --strict
          prodockit pdf
          prodockit update-dates
          mkdir -p /tmp/latest
          cp -R site /tmp/latest/site
          cp docs/site_documentation.pdf /tmp/latest/doc.pdf
          {
            echo "latest_zensical=$(pip show zensical | awk '/^Version:/{print $2}')"
            echo "latest_weasyprint=$(pip show weasyprint | awk '/^Version:/{print $2}')"
            echo "latest_markdown=$(pip show markdown | awk '/^Version:/{print $2}')"
            echo "latest_pymdownx=$(pip show pymdown-extensions | awk '/^Version:/{print $2}')"
          } >> "$GITHUB_ENV"

      # Against the *newest* build, so a release that breaks the real
      # rendering checks is caught here rather than on the day someone
      # raises the pin. Never fails the job - the result is reported.
      - name: Run the built-output checks against the newest build
        id: tests
        continue-on-error: true
        run: python -m pytest tests/test_built_docs.py -m built -q

      - name: Compare, and open an issue if anything moved
        env:
          GH_TOKEN: ${{ github.token }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          set -u
          pdf_state=$(cmp -s /tmp/pinned/doc.pdf /tmp/latest/doc.pdf \
            && echo "identical" || echo "**differs**")
          site_changed=$(diff -rq /tmp/pinned/site /tmp/latest/site 2>/dev/null | wc -l | tr -d ' ')

          versions_moved="no"
          [ "$pinned_zensical" != "$latest_zensical" ] && versions_moved="yes"
          [ "$pinned_weasyprint" != "$latest_weasyprint" ] && versions_moved="yes"
          [ "$pinned_markdown" != "$latest_markdown" ] && versions_moved="yes"
          [ "$pinned_pymdownx" != "$latest_pymdownx" ] && versions_moved="yes"

          if [ "$versions_moved" = "no" ]; then
            echo "Pins are current: zensical $pinned_zensical, weasyprint $pinned_weasyprint, Markdown $pinned_markdown, pymdown-extensions $pinned_pymdownx. Nothing to report."
            exit 0
          fi

          # One open issue at a time - a weekly job that opens a fresh issue
          # every Monday until someone acts is worse than no job at all.
          existing=$(gh issue list --state open --search "in:title Dependency drift" \
            --json number --jq '.[0].number // empty')

          # Written to a file rather than captured with $( ), and passed as
          # --body-file. A heredoc inside command substitution is parsed for
          # quotes, so a single apostrophe in the prose - "zensical's floor"
          # - opens a quote that never closes and the whole script fails to
          # parse. Backticks still need escaping either way: the delimiter
          # is unquoted so that the version variables expand.
          cat > /tmp/drift-issue.md <<EOF
          A newer build input is available than the docs build pins.

          | | Pinned | Newest |
          |---|---|---|
          | \`zensical\` | $pinned_zensical | $latest_zensical |
          | \`weasyprint\` | $pinned_weasyprint | $latest_weasyprint |
          | \`Markdown\` | $pinned_markdown | $latest_markdown |
          | \`pymdown-extensions\` | $pinned_pymdownx | $latest_pymdownx |

          Built the docs with each, in the same job, and compared byte for byte:

          - **PDF**: $pdf_state
          - **Website**: $site_changed files differ
          - **Built-output checks against the newest build**: $TESTS_OUTCOME

          Both builds used the same pandoc, Chrome, fonts and runner image, so
          any difference above is attributable to these two packages alone.

          A difference is not automatically a problem - when the pins last
          moved, 0.0.52 changed every page of the site (Font Awesome redrew the
          GitHub icon) and left the PDF byte-identical. The point is to decide,
          rather than have it arrive unnoticed.

          To take the upgrade: bump the versions in \`.github/workflows/docs.yml\`
          and \`.github/workflows/ci.yml\`, and \`zensical\`'s floor in
          \`pyproject.toml\`, then rebuild and diff before committing.

          <sub>Opened by \`drift.yml\`. Updated in place rather than reopened while this stays open.</sub>
          EOF

          if [ -n "$existing" ]; then
            echo "Updating existing issue #$existing"
            gh issue comment "$existing" --body-file /tmp/drift-issue.md
          else
            gh issue create \
              --title "Dependency drift: newer zensical/weasyprint than the docs build pins" \
              --body-file /tmp/drift-issue.md
          fi
