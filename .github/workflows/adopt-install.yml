name: Adopt installed wheel
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  installed-wheel:
    name: ${{ matrix.name }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            runner: ubuntu-24.04
            architecture: x64
            architecture_check: --require-x64
            scenario_args: --scenario all
          - name: Windows 2025
            runner: windows-2025
            architecture: x64
            architecture_check: --require-x64
            scenario_args: --scenario toml-both
          - name: Ubuntu 24.04
            runner: ubuntu-24.04-arm
            architecture: arm64
            architecture_check: --require-arm64
            scenario_args: --scenario all
          - name: Windows 11
            runner: windows-11-arm
            architecture: arm64
            architecture_check: --require-arm64
            scenario_args: --scenario toml-both
          - name: macOS 15
            runner: macos-15
            architecture: arm64
            architecture_check: --require-arm64
            scenario_args: --scenario all
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build the candidate wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Test prodockit adopt from the installed wheel
        # The acceptance build exercises website integration. It verifies the
        # Mermaid CLI install, but does not render a PDF, so downloading a
        # second browser into every disposable fixture would only lengthen the
        # independent runner.
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: >-
          python tools/adopt_acceptance.py
          --wheel dist
          ${{ matrix.architecture_check }}
          ${{ matrix.scenario_args }}
          --report adopt-acceptance-report.json
      - name: Keep the acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adopt-${{ matrix.runner }}-${{ matrix.architecture }}
          path: adopt-acceptance-report.json
          if-no-files-found: warn
