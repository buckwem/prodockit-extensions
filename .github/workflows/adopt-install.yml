name: Adopt installed wheel
run-name: Adopt wheel installation and real project upgrades
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITHUB_TOKEN: ${{ github.token }}
  PIP_RETRIES: 5
  PIP_TIMEOUT: 30
  PIP_PREFER_BINARY: 1

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.scope.outputs.adopt }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scope
        name: Check whether adoption or packaging changed
        run: python tools/ci_scope.py --github-event >> "$GITHUB_OUTPUT"

  installed-wheel:
    needs: scope
    if: needs.scope.outputs.relevant == 'true'
    name: ${{ matrix.name }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    # One apply attempt may use the harness's full 15-minute command budget.
    # Keep enough job time for its single bounded transient-renderer retry.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            runner: ubuntu-24.04
            architecture: x64
            architecture_check: --require-x64
            scenario_args: --scenario toml-default --scenario toml-core --scenario yaml-core --scenario toml-both
          - name: Windows 2025
            runner: windows-2025
            architecture: x64
            architecture_check: --require-x64
            scenario_args: --scenario toml-default --scenario toml-both
          - name: Ubuntu 24.04
            runner: ubuntu-24.04-arm
            architecture: arm64
            architecture_check: --require-arm64
            scenario_args: --scenario toml-default --scenario toml-core --scenario yaml-core --scenario toml-both
          - name: macOS 15
            runner: macos-15
            architecture: arm64
            architecture_check: --require-arm64
            scenario_args: --scenario toml-default --scenario toml-core --scenario yaml-core --scenario toml-both
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the test-only macOS Pango prerequisite
        if: runner.os == 'macOS'
        run: |
          brew install pango
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Build the candidate wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Test prodockit adopt from the installed wheel
        run: >-
          python tools/adopt_acceptance.py
          --wheel dist
          ${{ matrix.architecture_check }}
          ${{ matrix.scenario_args }}
          --report adopt-acceptance-report.json
      - name: Keep the acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adopt-${{ matrix.runner }}-${{ matrix.architecture }}
          path: adopt-acceptance-report.json
          if-no-files-found: warn

  template-sync:
    needs: scope
    if: needs.scope.outputs.relevant == 'true'
    name: Template sync — ${{ matrix.name }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    # Each job genuinely prepares two supported toolchains and then exercises
    # one pip upgrade and one pip downgrade.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            runner: ubuntu-24.04
            architecture: x64
            architecture_check: --require-x64
          - name: Ubuntu 24.04
            runner: ubuntu-24.04-arm
            architecture: arm64
            architecture_check: --require-arm64
          - name: Windows 2025
            runner: windows-2025
            architecture: x64
            architecture_check: --require-x64
          - name: macOS 15 Intel
            runner: macos-15-intel
            architecture: x64
            architecture_check: --require-x64
          - name: macOS 15
            runner: macos-15
            architecture: arm64
            architecture_check: --require-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Pango on macOS
        if: runner.os == 'macOS'
        run: |
          brew install pango
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: Build the candidate wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Exercise real upgrade, downgrade and fresh-process handoff
        run: >-
          python tools/template_sync_acceptance.py
          --wheel dist
          ${{ matrix.architecture_check }}
          --report template-sync-acceptance-report.json
      - name: Keep the acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-sync-${{ matrix.runner }}-${{ matrix.architecture }}
          path: template-sync-acceptance-report.json
          if-no-files-found: warn

  result:
    name: Adopt installed-wheel result
    if: always()
    needs: [scope, installed-wheel, template-sync]
    runs-on: ubuntu-24.04
    steps:
      - name: Report the selected scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RELEVANT: ${{ needs.scope.outputs.relevant }}
          MATRIX_RESULT: ${{ needs.installed-wheel.result }}
          TEMPLATE_SYNC_RESULT: ${{ needs.template-sync.result }}
        run: |
          if [ "$SCOPE_RESULT" != success ]; then
            echo "The changed-file classifier failed."
            exit 1
          fi
          if [ "$RELEVANT" = true ] && [ "$MATRIX_RESULT" != success ]; then
            echo "The adoption installed-wheel matrix did not pass."
            exit 1
          fi
          if [ "$RELEVANT" = true ] && [ "$TEMPLATE_SYNC_RESULT" != success ]; then
            echo "The template-sync prerequisite matrix did not pass."
            exit 1
          fi
          if [ "$RELEVANT" != true ]; then
            echo "No adoption, packaging or shared integration files changed."
          fi
