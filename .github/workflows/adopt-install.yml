name: Adopt installed wheel
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.scope.outputs.adopt }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scope
        name: Check whether adoption or packaging changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-only --diff-filter=ACDMR "$BASE_SHA" "$HEAD_SHA" |
              python tools/ci_scope.py >> "$GITHUB_OUTPUT"
          else
            python tools/ci_scope.py --all >> "$GITHUB_OUTPUT"
          fi

  installed-wheel:
    needs: scope
    if: needs.scope.outputs.relevant == 'true'
    name: ${{ matrix.name }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            runner: ubuntu-24.04
            architecture: x64
            architecture_check: --require-x64
            scenario_args: --scenario all
          - name: Windows 2025
            runner: windows-2025
            architecture: x64
            architecture_check: --require-x64
            scenario_args: --scenario toml-both
          - name: Ubuntu 24.04
            runner: ubuntu-24.04-arm
            architecture: arm64
            architecture_check: --require-arm64
            scenario_args: --scenario all
          - name: Windows 11
            runner: windows-11-arm
            architecture: arm64
            architecture_check: --require-arm64
            scenario_args: --scenario toml-both
          - name: macOS 15
            runner: macos-15
            architecture: arm64
            architecture_check: --require-arm64
            scenario_args: --scenario all
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build the candidate wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Test prodockit adopt from the installed wheel
        # The acceptance build exercises website integration. It verifies the
        # Mermaid CLI install, but does not render a PDF, so downloading a
        # second browser into every disposable fixture would only lengthen the
        # independent runner.
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: >-
          python tools/adopt_acceptance.py
          --wheel dist
          ${{ matrix.architecture_check }}
          ${{ matrix.scenario_args }}
          --report adopt-acceptance-report.json
      - name: Keep the acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adopt-${{ matrix.runner }}-${{ matrix.architecture }}
          path: adopt-acceptance-report.json
          if-no-files-found: warn

  result:
    name: Adopt installed-wheel result
    if: always()
    needs: [scope, installed-wheel]
    runs-on: ubuntu-24.04
    steps:
      - name: Report the selected scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RELEVANT: ${{ needs.scope.outputs.relevant }}
          MATRIX_RESULT: ${{ needs.installed-wheel.result }}
        run: |
          if [ "$SCOPE_RESULT" != success ]; then
            echo "The changed-file classifier failed."
            exit 1
          fi
          if [ "$RELEVANT" = true ] && [ "$MATRIX_RESULT" != success ]; then
            echo "The adoption installed-wheel matrix did not pass."
            exit 1
          fi
          if [ "$RELEVANT" != true ]; then
            echo "No adoption, packaging or shared integration files changed."
          fi
