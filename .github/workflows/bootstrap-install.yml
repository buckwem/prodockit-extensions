name: Bootstrap installed wheel
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.scope.outputs.bootstrap }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scope
        name: Check whether bootstrap or packaging changed
        run: python tools/ci_scope.py --github-event >> "$GITHUB_OUTPUT"

  installed-wheel:
    needs: scope
    if: needs.scope.outputs.relevant == 'true'
    name: ${{ matrix.name }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            runner: ubuntu-24.04
            architecture: x64
            architecture_check: --require-x64
          - name: Ubuntu 24.04
            runner: ubuntu-24.04-arm
            architecture: arm64
            architecture_check: --require-arm64
          - name: Windows 2025
            runner: windows-2025
            architecture: x64
            architecture_check: --require-x64
          - name: Windows 11
            runner: windows-11-arm
            architecture: arm64
            architecture_check: --require-arm64
          - name: macOS 15
            runner: macos-15
            architecture: arm64
            architecture_check: --require-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build the candidate wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Test all Surrey GitLab and public GitHub bootstrap routes
        run: >-
          python tools/bootstrap_acceptance.py
          --wheel dist
          ${{ matrix.architecture_check }}
          --report bootstrap-acceptance-report.json
      - name: Keep the acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.runner }}-${{ matrix.architecture }}
          path: bootstrap-acceptance-report.json
          if-no-files-found: warn

  result:
    name: Bootstrap installed-wheel result
    if: always()
    needs: [scope, installed-wheel]
    runs-on: ubuntu-24.04
    steps:
      - name: Report the selected scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RELEVANT: ${{ needs.scope.outputs.relevant }}
          MATRIX_RESULT: ${{ needs.installed-wheel.result }}
        run: |
          if [ "$SCOPE_RESULT" != success ]; then
            echo "The changed-file classifier failed."
            exit 1
          fi
          if [ "$RELEVANT" = true ] && [ "$MATRIX_RESULT" != success ]; then
            echo "The bootstrap installed-wheel matrix did not pass."
            exit 1
          fi
          if [ "$RELEVANT" != true ]; then
            echo "No bootstrap, packaging or shared integration files changed."
          fi
