name: Bootstrap installed wheel
run-name: Bootstrap wheel installation, clean setup and real software upgrades
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.scope.outputs.bootstrap }}
      native: ${{ steps.scope.outputs['bootstrap-native'] }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scope
        name: Check whether bootstrap or packaging changed
        run: python tools/ci_scope.py --github-event >> "$GITHUB_OUTPUT"

  installed-wheel:
    needs: scope
    if: needs.scope.outputs.relevant == 'true'
    name: ${{ matrix.name }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            runner: ubuntu-24.04
            architecture: x64
            architecture_check: --require-x64
          - name: Ubuntu 24.04
            runner: ubuntu-24.04-arm
            architecture: arm64
            architecture_check: --require-arm64
          - name: Windows 2025
            runner: windows-2025
            architecture: x64
            architecture_check: --require-x64
          - name: Windows 11
            runner: windows-11-arm
            architecture: arm64
            architecture_check: --require-arm64
          - name: macOS 15
            runner: macos-15
            architecture: arm64
            architecture_check: --require-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build the candidate wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Test all Surrey GitLab and public GitHub bootstrap routes
        run: >-
          python tools/bootstrap_acceptance.py
          --wheel dist
          ${{ matrix.architecture_check }}
          --report bootstrap-acceptance-report.json
      - name: Keep the acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.runner }}-${{ matrix.architecture }}
          path: bootstrap-acceptance-report.json
          if-no-files-found: warn

  native-install:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    name: Real install — ${{ matrix.name }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            runner: ubuntu-24.04
            architecture: x64
            architecture_check: --require-x64
          - name: Ubuntu 24.04
            runner: ubuntu-24.04-arm
            architecture: arm64
            architecture_check: --require-arm64
          - name: Windows 2025
            runner: windows-2025
            architecture: x64
            architecture_check: --require-x64
          - name: Windows 11
            runner: windows-11-arm
            architecture: arm64
            architecture_check: --require-arm64
          - name: macOS 15
            runner: macos-15
            architecture: arm64
            architecture_check: --require-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build and install the candidate wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('dist').glob('prodockit-*.whl')); subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', str(wheel)], check=True)"
      - name: Remove runner tools, then execute Bootstrap's real install plans
        run: >-
          python tools/bootstrap_native_install.py
          --wheel dist
          ${{ matrix.architecture_check }}
          --report bootstrap-native-install-report.json
      - name: Keep the native install report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-native-${{ matrix.runner }}-${{ matrix.architecture }}
          path: bootstrap-native-install-report.json
          if-no-files-found: warn

  native-upgrade:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    name: >-
      Real upgrade — ${{ matrix.scenario.name }} —
      ${{ matrix.platform.name }} ${{ matrix.platform.architecture }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Ubuntu 24.04
            runner: ubuntu-24.04
            architecture: x64
            architecture_check: --require-x64
          - name: Ubuntu 24.04
            runner: ubuntu-24.04-arm
            architecture: arm64
            architecture_check: --require-arm64
          - name: Windows 2025
            runner: windows-2025
            architecture: x64
            architecture_check: --require-x64
          - name: Windows 11
            runner: windows-11-arm
            architecture: arm64
            architecture_check: --require-arm64
          - name: macOS 15
            runner: macos-15
            architecture: arm64
            architecture_check: --require-arm64
        scenario:
          - name: Surrey existing repository
            id: surrey-existing-real-upgrade
          - name: GitHub new repository
            id: github-new-real-upgrade
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build and install the candidate wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -c "from pathlib import Path; import subprocess, sys; wheel = next(Path('dist').glob('prodockit-*.whl')); subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', str(wheel)], check=True)"
      - name: Upgrade real old software through the Surrey and GitHub routes
        run: >-
          python tools/bootstrap_native_upgrade.py
          --wheel dist
          ${{ matrix.platform.architecture_check }}
          --scenario ${{ matrix.scenario.id }}
          --report bootstrap-native-upgrade-report.json
      - name: Keep the native upgrade report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-upgrade-${{ matrix.platform.runner }}-${{ matrix.platform.architecture }}-${{ matrix.scenario.id }}
          path: bootstrap-native-upgrade-report.json
          if-no-files-found: warn

  result:
    name: Bootstrap installed-wheel result
    if: always()
    needs: [scope, installed-wheel, native-install, native-upgrade]
    runs-on: ubuntu-24.04
    steps:
      - name: Report the selected scope
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RELEVANT: ${{ needs.scope.outputs.relevant }}
          NATIVE: ${{ needs.scope.outputs.native }}
          MATRIX_RESULT: ${{ needs.installed-wheel.result }}
          NATIVE_RESULT: ${{ needs.native-install.result }}
          UPGRADE_RESULT: ${{ needs.native-upgrade.result }}
        run: |
          if [ "$SCOPE_RESULT" != success ]; then
            echo "The changed-file classifier failed."
            exit 1
          fi
          if [ "$RELEVANT" = true ] && [ "$MATRIX_RESULT" != success ]; then
            echo "The bootstrap installed-wheel matrix did not pass."
            exit 1
          fi
          if [ "$NATIVE" = true ] && [ "$NATIVE_RESULT" != success ]; then
            echo "The Bootstrap real-install release matrix did not pass."
            exit 1
          fi
          if [ "$NATIVE" = true ] && [ "$UPGRADE_RESULT" != success ]; then
            echo "The Bootstrap real-upgrade release matrix did not pass."
            exit 1
          fi
          if [ "$RELEVANT" != true ]; then
            echo "No bootstrap, packaging or shared integration files changed."
          fi
