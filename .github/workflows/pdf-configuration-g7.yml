name: PDF configuration G7 acceptance
on:
  pull_request:
    paths:
      - .github/workflows/pdf-configuration-g7.yml
      - pdk-pdf.toml
      - src/prodockit/adopt.py
      - src/prodockit/adopt_toml.py
      - src/prodockit/config_diagnostics.py
      - src/prodockit/diagnostics.py
      - src/prodockit/pdf/**
      - tools/pdf_configuration_g7_acceptance.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  template:
    name: Template migration and cold/warm PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: buckwem/prodockit-template
          path: template
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install PDF system libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Install template dependencies and candidate
        run: |
          python -m pip install -r template/requirements.txt
          python -m pip install -e ".[testing]"
      - name: Fetch template citation style
        run: >-
          curl -fsSL --retry 3 --max-time 60
          https://www.zotero.org/styles/harvard-cite-them-right
          -o template/harvard-cite-them-right.csl
      - name: Exercise migration, real first use, cached reuse and failure recovery
        run: >-
          python tools/pdf_configuration_g7_acceptance.py
          --template template
          --work-dir pdf-configuration-g7-work
          --report pdf-configuration-g7.json
      - name: Keep G7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-configuration-g7
          path: |
            pdf-configuration-g7.json
            pdf-configuration-g7-work/template/pdk-pdf.toml
            pdf-configuration-g7-work/template/docs/site_documentation.pdf
          if-no-files-found: warn
