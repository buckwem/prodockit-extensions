name: CI
on:
  push:
    branches: [main]
  pull_request:

# A new commit supersedes an older run of the same pull request. Main keeps
# every run: it is the complete post-merge compatibility backstop.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# The runner image's own `pandoc` package lags well behind upstream -
# `ubuntu-24.04` currently ships 3.1.3, while a contributor on macOS or
# Windows has whatever Homebrew or winget last gave them. That gap is not
# cosmetic: pandoc 3.1.3 accepted `<pre><code>` containing element markup
# as a code block and 3.10 does not, so every fenced code block in the PDF
# reflowed as justified prose on a current pandoc while CI kept publishing
# perfect output (prodockit-extensions#207). CI could not see the bug, and
# would have started producing it unannounced at the next image bump.
#
# Pinning an upstream release keeps CI and local development on one
# version, and makes a pandoc change an explicit commit rather than a
# silent inheritance.
#
# prodockit-template pins the same way and currently says 3.10; it and
# prodockit-userguide's .gitlab-ci.yml both need bringing to this number,
# so the family builds its PDFs with one pandoc rather than three
# (prodockit-extensions#209).
env:
  PANDOC_VERSION: "3.10.1"

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      python-matrix: ${{ steps.scope.outputs.python-matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scope
        name: Select the supported Python versions needed by this change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git diff --name-only --diff-filter=ACDMR "$BASE_SHA" "$HEAD_SHA" |
              python tools/ci_scope.py >> "$GITHUB_OUTPUT"
          else
            python tools/ci_scope.py --all >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: scope
    runs-on: ubuntu-24.04
    # Finishes in about two minutes; 3.6 was the slowest of 132.
    # The margin is for a slow runner, not for a stall - a job that
    # hangs must fail while somebody is still watching (#478).
    timeout-minutes: 15
    strategy:
      matrix:
        # PRs test 3.14 for every change and add the oldest supported
        # interpreter when Python can be affected. Main still tests all five.
        python-version: ${{ fromJSON(needs.scope.outputs.python-matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # Caches ~/.cache/pip, which holds pip's own *built* wheels as
          # well as its downloads. That matters here because adding
          # weasyprint below pulls in packages with no wheel published for
          # every interpreter this matrix covers - on 3.13 the install
          # step spent 13 minutes compiling them from source, against ~20
          # seconds on 3.10-3.12. Cached, that cost is paid once per
          # interpreter rather than on every run. Keyed on pyproject.toml,
          # so it only re-resolves when the dependencies actually change.
          cache: pip
          cache-dependency-path: pyproject.toml
      # prodockit.bibliography's own tests need a real pandoc install - its
      # citation/bibliography formatting is delegated entirely to `pandoc
      # --citeproc`, so a fake stand-in (unlike the plain stub used
      # elsewhere for prodockit.pdf's own orchestration-only tests)
      # wouldn't actually test anything meaningful.
      #
      # The Pango/HarfBuzz libraries are WeasyPrint's own rendering stack
      # (it is a real native dependency, not a pure-Python package) - see
      # the weasyprint install below for why this job needs it at all.
      # The image's mirrorlist puts `azure.archive.ubuntu.com` first. When
      # that host is down - it was, repeatedly, on 2026-08-18 - apt spends
      # minutes on it before reaching the `archive.ubuntu.com` fallback,
      # which answers in milliseconds throughout. Neither a shorter
      # connect timeout nor fewer retries reached it in reasonable time,
      # so the dead host is taken out of the list instead (#478).
      #
      # Reported rather than assumed: if the image stops shipping a
      # mirrorlist, or stops using Azure, the run says so and carries on
      # unchanged - a substitution that quietly matched nothing would be
      # worse than either.
      - name: Point apt at a mirror that answers
        if: matrix.python-version == '3.14'
        timeout-minutes: 2
        run: |
          list=/etc/apt/apt-mirrors.txt
          if [ ! -f "$list" ]; then
            echo "::notice::no $list in this image - apt left as it is"
          elif ! grep -q 'azure.archive.ubuntu.com' "$list"; then
            echo "::notice::$list no longer names Azure - apt left as it is"
          else
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$list"
            echo "mirrorlist now:"; cat "$list"
          fi
      # A mirror that stalls must fail fast, not hold the runner: this
      # step takes seconds, and once sat 35 minutes (#478).
      #
      # The image lists `azure.archive.ubuntu.com` first and
      # `https://archive.ubuntu.com` as a fallback. When the first is
      # dead the fallback works - but apt waits out a 120-second connect
      # timeout per source before trying it, four sources deep. Ten
      # seconds is far above a healthy mirror's response and reaches the
      # fallback in a fraction of the time.
      #
      # Retries are deliberately not raised: they re-ask the dead mirror
      # rather than moving on, which is what exhausted the budget when
      # this was first tried.
      - if: matrix.python-version == '3.14'
        run: >
          sudo apt-get -o Acquire::http::Timeout=10 update && sudo apt-get -o Acquire::http::Timeout=10 install -y
          curl libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
        timeout-minutes: 8
      # Upstream release rather than the image's package - see PANDOC_VERSION.
      #
      # Cached because the release CDN is the single most fragile thing in
      # this job: it returned 503 for hours one evening and failed every
      # run in the matrix before a single test executed. The key carries
      # the version, so a bump fetches afresh and an unchanged pin never
      # touches the network again.
      - id: pandoc-cache
        if: matrix.python-version == '3.14'
        uses: actions/cache@v4
        with:
          path: /tmp/pandoc.deb
          key: pandoc-${{ env.PANDOC_VERSION }}-amd64-deb
      # The retry stays for the first run on a new key, and for the day
      # the cache is evicted - a cache is a saving, not a guarantee.
      - if: matrix.python-version == '3.14' && steps.pandoc-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 -o /tmp/pandoc.deb "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
      - if: matrix.python-version == '3.14'
        run: sudo apt install -y /tmp/pandoc.deb
      # weasyprint on top of [dev]: tests/test_pdf_build.py's
      # `real_pandoc_and_weasyprint_required` cases render a real PDF and
      # then assert on where things actually landed - which page a heading
      # starts on, what the running header says, whether a long index term
      # stayed inside its column. The fake-pandoc stub every other test in
      # that file uses writes a placeholder file and cannot answer any of
      # those. Without weasyprint here they skipped silently on every run,
      # so the behaviour they exist to pin was never checked by CI at all -
      # `docs.yml` installs weasyprint but only runs `-m built` against
      # tests/test_built_docs.py, so it never reaches them either.
      #
      # Pinned to the same version docs.yml builds with. These tests assert
      # on where things physically land in a rendered PDF - which page a
      # heading starts on, whether a long index term stayed inside its
      # column - so the layout engine is an input to the assertions, not an
      # implementation detail. An unpinned bump would move the measurements
      # and read as a code regression. drift.yml watches for newer releases.
      - if: matrix.python-version == '3.14'
        run: pip install -e ".[dev]" "weasyprint==69.0"
      - if: matrix.python-version != '3.14'
        run: pip install -e ".[dev]"
      # Static analysis describes one source tree, not an interpreter
      # matrix. Running it once avoids four identical checks.
      - if: matrix.python-version == '3.14'
        run: ruff check .
      - if: matrix.python-version == '3.14'
        run: mypy src
      # The same version is declared in pyproject.toml and in every workflow
      # that builds or tests, and nothing else keeps them in step. Moving one
      # and forgetting another is easy to do by hand and invisible when it
      # happens: CI then builds with one version while the declared floor
      # says another, and the published output stops matching what was
      # tested.
      #
      # `--offline` is load-bearing, not a speed optimisation. Plain
      # `--check` also fails when a package is *behind PyPI*, which is a
      # fact about the world rather than about this repository - it would
      # turn every open pull request red the day upstream ships a release,
      # with nothing here having changed and nothing the author could do
      # about it. drift.yml already watches for newer releases weekly and
      # deliberately reports rather than fails, for exactly that reason. It
      # also means this job needs no network.
      - if: matrix.python-version == '3.14'
        run: prodockit pins --check --offline
      # Coverage is also generated once. Compatibility jobs still execute
      # the suite, but without paying the instrumentation cost.
      - if: matrix.python-version == '3.14'
        run: pytest --cov=prodockit
      - if: matrix.python-version != '3.14'
        run: pytest

  docs:
    runs-on: ubuntu-24.04
    # Under a minute in every run measured.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # See docs.yml's own deploy job for why - matches its checkout so
          # this build validates the same real {{ release }} behaviour the
          # deployed site/PDF actually get.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pip install -e .
      - run: zensical build --clean --strict
      - run: prodockit update-dates
      - name: Check the reusable website has no analytics controls
        run: |
          if grep -RFlq --include='*.html' 'href="#__consent"' site; then
            echo "::error::The reusable website contains a cookie-settings link."
            exit 1
          fi
          if grep -RFlq --include='*.html' 'googletagmanager.com' site; then
            echo "::error::The reusable website contains Google Analytics."
            exit 1
          fi
      - name: Exercise the canonical analytics configuration
        run: |
          python tools/canonical_site_config.py zensical.toml .zensical-canonical.toml G-TEST123
          zensical build --config-file .zensical-canonical.toml --clean --strict
          prodockit update-dates --config-file .zensical-canonical.toml
          grep -RFlq --include='*.html' 'G-TEST123' site
          grep -RFlq --include='*.html' 'href="#__consent"' site
