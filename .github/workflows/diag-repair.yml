name: Diagnostic repair acceptance
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.scope.outputs.diagnostics }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scope
        name: Check whether diagnostic repair or packaging changed
        run: python tools/ci_scope.py --github-event >> "$GITHUB_OUTPUT"

  acceptance:
    needs: scope
    if: needs.scope.outputs.relevant == 'true'
    name: ${{ matrix.name }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    # Leave five minutes after the driver limit to publish its report and logs.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            runner: ubuntu-24.04
            architecture: x64
            architecture_check: --require-x64
          - name: Ubuntu 24.04
            runner: ubuntu-24.04-arm
            architecture: arm64
            architecture_check: --require-arm64
          - name: Windows 2025
            runner: windows-2025
            architecture: x64
            architecture_check: --require-x64
          - name: macOS 15
            runner: macos-15-intel
            architecture: x64
            architecture_check: --require-x64
          - name: macOS 15
            runner: macos-15
            architecture: arm64
            architecture_check: --require-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Use a repository-owned temporary directory on Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$HOME/prodockit-diagnostics-tmp"
          echo "TMPDIR=$HOME/prodockit-diagnostics-tmp" >> "$GITHUB_ENV"
      - name: Build the candidate wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Repair every fixable diagnostic from the installed wheel
        run: >-
          python tools/diagnostics_repair_acceptance.py
          --wheel dist
          ${{ matrix.architecture_check }}
          --report diagnostics-repair-acceptance-report.json
          --driver-timeout-seconds 1800
          --keep-on-failure
      - name: Keep the acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-repair-${{ matrix.runner }}-${{ matrix.architecture }}
          path: diagnostics-repair-acceptance-report.json
          if-no-files-found: warn
