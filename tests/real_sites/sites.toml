[[site]]
name = "zensical-docs"
repository = "https://github.com/zensical/docs.git"
revision = "790d2ac4a69d53ed2536bc59423b62034b01f73e"
config = "mkdocs.yml"
output = "site"
build = ["{python}", "-m", "zensical", "build", "-f", "mkdocs.yml", "--clean"]
pages = [
    "get-started/index.html",
    "authoring/data-tables/index.html",
    "authoring/math/index.html",
]
expected_changes = [
    ".prodockit-components.toml",
    "docs/stylesheets/prodockit.css",
    "mkdocs.yml",
    "requirements.txt",
]
python_packages = ["markdown-exec"]
mermaid = false
maths = false
# The maths example's code-annotation marker pulses after page load. Mask only
# that marker. Permit at most roughly seven Chrome anti-aliasing pixels in a
# 1440 x 1200 capture; this is far below a visible difference.
ignore_rectangles = [[595, 925, 620, 950]]
max_changed_pixel_ratio = 0.000005

[[site]]
name = "fastapi"
repository = "https://github.com/fastapi/fastapi.git"
revision = "c3f316b7e814667e8ee81e03a7330d00ee61e45c"
working_directory = "docs/en"
config = "mkdocs.yml"
output = "site"
build = ["{python}", "-m", "zensical", "build", "-f", "mkdocs.yml", "--clean"]
pages = [
    "index.html",
    "tutorial/first-steps/index.html",
    "reference/fastapi/index.html",
]
expected_changes = [
    "docs/en/.prodockit-components.toml",
    "docs/en/docs/stylesheets/prodockit.css",
    "docs/en/mkdocs.yml",
    "docs/en/requirements.txt",
]
python_packages = [
    "annotated-doc>=0.0.2",
    "griffe-typingdoc>=0.3.0",
    "griffe-warnings-deprecated>=1.1.0",
    "httpx>=0.23.0,<1.0.0",
    "jieba>=0.42.1",
    "markdown-include-variants>=0.0.8",
    "mdx-include>=1.4.1,<2.0.0",
    "mkdocstrings[python]>=1.0.3",
    "pydantic>=2.9.0",
    "python-slugify>=8.0.4",
    "starlette>=0.46.0",
    "typing-extensions>=4.8.0",
    "typing-inspection>=0.4.2",
]
mermaid = false
maths = false
# FastAPI deliberately rotates the announcement and sponsor banner across the
# top strip. Every page pixel below that live content must remain identical.
ignore_rectangles = [[0, 0, 1440, 64]]
max_changed_pixel_ratio = 0.0

