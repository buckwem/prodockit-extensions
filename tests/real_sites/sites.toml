[[site]]
name = "pymdown-extensions"
repository = "https://github.com/facelessuser/pymdown-extensions.git"
revision = "b8996d7d87502176c5159d708c5d25a0e36839a9"
config = "zensical.yml"
output = "site"
build = ["{python}", "-m", "zensical", "build", "-f", "zensical.yml", "--clean"]
pages = [
    "index.html",
    "extensions/arithmatex/index.html",
    "extensions/superfences/index.html",
]
expected_changes = [
    ".prodockit-components.toml",
    "docs/src/markdown/stylesheets/prodockit.css",
    "requirements/docs.txt",
    "zensical.yml",
]
mermaid = false
maths = false
# The sponsorship heart pulses continuously. Mask only that animated icon;
# every other captured pixel must remain identical.
ignore_rectangles = [[285, 5, 335, 45]]
max_changed_pixel_ratio = 0.0

