  "tests/test_rendering_catalogue_built.py::test_deep_admonition_examples_flatten_cleanly_in_the_page_pdf",
  "tests/test_rendering_catalogue_built.py::test_multiple_long_notes_remain_intact_across_pdf_pages",
  "tests/test_rendering_catalogue_built.py::test_multiple_long_footnotes_remain_complete_across_pages",
  "tests/test_rendering_catalogue_built.py::test_multiple_long_footnotes_keep_numeric_order_when_the_area_overflows",
  "tests/test_rendering_catalogue_built.py::test_oversized_footnote_splits_complete_and_in_order",
  "tests/test_rendering_catalogue_built.py::test_two_footnotes_in_one_paragraph_share_the_reference_page",
  "tests/test_rendering_catalogue_built.py::test_multi_paragraph_footnote_preserves_visible_separation",
  "tests/test_rendering_catalogue_built.py::test_repeated_reference_renders_one_body_for_both_calls",
  "tests/test_rendering_catalogue_built.py::test_nested_footnotes_stay_with_list_admonition_and_step_calls",
  "tests/test_rendering_catalogue_built.py::test_long_footnote_url_and_token_stay_inside_the_page",
  "tests/test_rendering_catalogue_built.py::test_oversized_admonition_continues_without_losing_content",
  "tests/test_rendering_catalogue_built.py::test_rich_admonition_keeps_its_nested_structures_together",
  "tests/test_rendering_catalogue_built.py::test_oversized_tab_and_grid_continue_before_their_siblings",
  "tests/test_rendering_catalogue_built.py::test_definition_and_task_list_labels_remain_with_their_content",
  "tests/test_rendering_catalogue_built.py::test_complex_table_repeats_its_header_without_splitting_rows",
  "tests/test_rendering_catalogue_built.py::test_figure_and_long_caption_remain_on_one_page",
  "tests/test_rendering_catalogue_built.py::test_page_local_bibliography_entries_paginate_without_splitting",
  "tests/test_rendering_catalogue_built.py::test_phase_two_specimens_are_present_in_the_catalogue_pdf",
  "tests/test_rendering_catalogue_built.py::test_phase_three_specimens_and_static_fallbacks_are_present_in_the_catalogue_pdf",
  "tests/test_rendering_catalogue_built.py::test_phase_four_specimens_and_static_fallbacks_are_present_in_the_catalogue_pdf",
]

[[layer]]
name = "visual review"
purpose = "The retained review bundle exposes complete, per-page and contact-sheet evidence for human inspection."
tests = [
  "tests/test_rendering_catalogue_built.py::test_phase_six_review_bundle_is_complete_and_self_consistent",
]
