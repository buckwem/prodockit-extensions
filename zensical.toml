[project]
site_name = "prodockit"
site_description = "A family of extensions for Zensical needed for professional and academic documentation: section cross-references, bibliography/citation handling, a glossary, and a Pandoc/WeasyPrint PDF pipeline."
site_author = "Mark Buckwell"
site_url = "https://buckwem.github.io/prodockit-extensions/"

repo_url = "https://github.com/buckwem/prodockit-extensions"
repo_name = "buckwem/prodockit-extensions"
edit_uri = "edit/main/docs/"

# A real HTML fragment - prodockit.pdf renders this as a real DOM element
# in the PDF's running footer now (CSS Paged Media's position: running()/
# content: element(), not a generated CSS content string), matching how
# Zensical's own website-side copyright already works. A literal "©"
# character or the "&copy;" HTML entity both work equally well here.
copyright = "Copyright © 2026 Mark Buckwell and contributors"

# Overrides `copyright` for the PDF's own footer only (the live website's
# footer instead gets its own "Made with Zensical and prodockit" credit
# from overrides/partials/copyright.html) - matching the same credit line,
# with real links, on this one, separate, PDF-only footer. Removing just
# this one line falls back to a plain `copyright`-only footer without
# touching the copyright text itself.
extra.pdf_copyright = 'Copyright © 2026 Mark Buckwell and contributors.<br>Made with <a href="https://zensical.org/">Zensical</a> and <a href="https://buckwem.github.io/prodockit-extensions/">prodockit</a>.'

# Generates the back-of-book index this project's own `prodockit.index`
# docs describe - so the project's own PDF demonstrates the feature it
# documents instead of describing a page it doesn't have.
#
# Terms are marked at the point each is actually discussed: every module
# at its own page's opening sentence, every option/setting/fixture in the
# reference table that defines it (nested under what it belongs to, so
# the repeated `source`/`registry`/`unresolved` options group per module
# rather than colliding), and the concepts and external tools where they
# are introduced. docs/extensions/index-terms.md's own "Result" tabs stay
# as they were - one marker per supported shape (flat, nested,
# code-styled, linked), which keeps every branch of prodockit.pdf.index
# exercised by the real build.
#
# Costs one extra pandoc+WeasyPrint pass on this build only - the index
# needs a real two-pass build (see prodockit.pdf.index's own docstring),
# and build_pdf() skips the second pass entirely when a document has no
# markers, so none of docs.yml's twelve single-page `prodockit pdf -m`
# builds pays anything for this. Mermaid/TeX pre-rendering happens before
# either pass, so it isn't repeated.
extra.pdf_include_index = true

extra_css = ["stylesheets/extra.css"]

# Client-side MathJax, for the website only - the PDF pre-renders the same
# formulas to SVG instead (see docs/javascripts/mathjax.js, and
# `pymdownx.arithmatex` below). Order is load-bearing: the config file must
# come first, because MathJax reads `window.MathJax` once at startup.
#
# MathJax is vendored rather than fetched from a CDN, so the site is
# self-contained: no third-party request on every page view, and it works
# offline. The copy is taken verbatim from tools/mathjax's own pinned
# install, so the website and the PDF typeset through byte-identical
# MathJax - see docs/javascripts/vendor/mathjax/README.md for which bundle
# and why, and how to replace it.
extra_javascript = [
  "javascripts/mathjax.js",
  "javascripts/vendor/mathjax/tex-svg-full.js",
]

nav = [
  {"Home" = "index.md"},
  {"Introduction" = "introduction.md"},
  {"Installation" = "installation.md"},
  {"Extensions" = [
    {"Headings" = "extensions/headings.md"},
    {"Cross-References" = "extensions/refs.md"},
    {"Citations or References" = "extensions/citations.md"},
    {"Acronyms and Glossary" = "extensions/glossary.md"},
    {"Tables" = "extensions/tables.md"},
    {"Directory Trees" = "extensions/tree.md"},
    {"Numbered Steps" = "extensions/steps.md"},
    {"Bibliography" = "extensions/bibliography.md"},
    {"Index (pdf-only)" = "extensions/index-terms.md"},
  ]},
  {"PDF generation" = "pdf.md"},
  {"Website macros" = "macros.md"},
  {"Dev Considerations" = [
    {"Introduction" = "devcons/devcons.md"},
    {"Machine bootstrap" = "devcons/bootstrap.md"},
    {"Continuous integration" = "devcons/continuous-integration.md"},
    {"Repository metadata" = "devcons/repo-metadata.md"},
    {"Version pinning and drift" = "devcons/pinning-drift.md"},
    {"Staying in step with the template" = "devcons/template-sync.md"},
    {"Testing your built site" = "devcons/testing.md"},
    {"Zensical coupling" = "devcons/zensical-coupling.md"},
    {"Limitations and workarounds" = "devcons/limitations.md"},
  ]},
  {"About" = [
    {"Release Notes" = "about/changelog.md"},
    {"License" = "about/license.md"},
  ]},
]

[project.theme]
logo = "assets/logo_black.png"
custom_dir = "overrides"
language = "en"
features = [
  "announce.dismiss",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.integrate",
]

[project.theme.icon]
view = "lucide/eye"
repo = "fontawesome/brands/github"

[project.theme.icon.admonition]
note = "fontawesome/solid/note-sticky"
abstract = "fontawesome/solid/book"
info = "fontawesome/solid/circle-info"
tip = "fontawesome/solid/bullhorn"
success = "fontawesome/solid/check"
question = "fontawesome/solid/circle-question"
warning = "fontawesome/solid/triangle-exclamation"
failure = "fontawesome/solid/bomb"
danger = "fontawesome/solid/skull"
bug = "fontawesome/solid/robot"
example = "fontawesome/solid/flask"
quote = "fontawesome/solid/quote-left"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/buckwem/prodockit-extensions"

# ----------------------------------------------------------------------------
# Markdown extensions used to render these docs. pymdownx.snippets is used to
# embed LICENSE (outside docs_dir) into about/license.md.
# ----------------------------------------------------------------------------
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
# Every prodockit extension this project itself documents, enabled on its
# own docs site too - not because any of these pages actually need live
# \ref{}/\cite{}/\citebib{}/\gls{} cross-references (every example of
# each syntax is shown inside a fenced code block/backtick span, exactly
# as its own docs recommend, so none of this resolves anything live
# today), but so the extensions this project ships are always available
# to use here too, and prodockit.citations/prodockit.bibliography (see
# their own docs' "Comparing the two approaches") can now be enabled
# together with no conflict - see \citebib{id} vs \cite{id}.
[project.markdown_extensions."prodockit.headings"]
numbering = "continuous"
[project.markdown_extensions."prodockit.refs"]
[project.markdown_extensions."prodockit.citations"]
[project.markdown_extensions."prodockit.glossary"]
[project.markdown_extensions."prodockit.bibliography"]
[project.markdown_extensions."prodockit.tables"]
[project.markdown_extensions."prodockit.steps"]
[project.markdown_extensions."prodockit.tree"]

[project.markdown_extensions."prodockit.index"]
# `generic = true` is required, not stylistic: it emits
# `<div|span class="arithmatex">` wrappers, which is the only form
# prodockit.pdf can pre-render - its Lua filter matches that class in its
# own Div()/Span() handlers, because Pandoc's *HTML* reader has no native
# Math AST node (see docs/devcons/limitations.md). Script mode's
# `<script type="math/tex">` would reach the PDF untouched.
#
# Enabled here so the toolchain this project ships is exercised by the
# project itself: tools/mathjax could not fire without it - no arithmatex
# markup means nothing for the Lua filter to act on - and
# test_no_page_contains_unrendered_tex_source could never fail. Both
# prodockit-template and prodockit-userguide already enable it; this repo
# was the only one of the three that did not.
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.zensical.extensions.macros]
# prodockit.zensical_macros is imported directly by macros.py's own
# define_env() instead of being listed here as a second `modules` entry -
# see macros.py's docstring for why (zensical/zensical#823).
module_name = "macros"
