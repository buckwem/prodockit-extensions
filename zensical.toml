[project]
site_name = "prodockit"
site_description = "A family of extensions for Zensical needed for professional and academic documentation: section cross-references, bibliography/citation handling, a glossary, and a Pandoc/WeasyPrint PDF pipeline."
site_author = "Mark Buckwell"
site_url = "https://prodockit.org/"

repo_url = "https://github.com/buckwem/prodockit-extensions"
repo_name = "buckwem/prodockit-extensions"
edit_uri = "edit/main/docs/"

# A real HTML fragment - prodockit.pdf renders this as a real DOM element
# in the PDF's running footer now (CSS Paged Media's position: running()/
# content: element(), not a generated CSS content string), matching how
# Zensical's own website-side copyright already works. A literal "©"
# character or the "&copy;" HTML entity both work equally well here.
copyright = "Copyright © 2026 Mark Buckwell and contributors"

# Overrides `copyright` for the PDF's own footer only (the live website's
# footer instead gets its own "Made with Zensical and prodockit" credit
# from overrides/partials/copyright.html) - matching the same credit line,
# with real links, on this one, separate, PDF-only footer. Removing just
# this one line falls back to a plain `copyright`-only footer without
# touching the copyright text itself.
extra.pdf_copyright = 'Copyright © 2026 Mark Buckwell and contributors.<br>Made with <a href="https://zensical.org/">Zensical</a> and <a href="https://prodockit.org/">prodockit</a>.'

extra_css = [
  "stylesheets/pdk.css",
  "stylesheets/branding.css",
  "stylesheets/extra.css",
]
extra.pdf_extra_css = [
  "stylesheets/pdk-pdf.css",
  "stylesheets/print.css",
]
# Keep chapter numbering on both the reference website and the downloadable
# PDF, including the PDF's numbered bookmark outline.
extra.heading_numbering = true
extra.website_heading_numbering = true

# Client-side MathJax, for the website only - the PDF pre-renders the same
# formulas to SVG instead (see `pymdownx.arithmatex` below). Order is
# load-bearing: the config file must come first, because MathJax reads
# `window.MathJax` once at startup.
#
# `prodockit init-mathjax` copies these ignored files from tools/mathjax's
# pinned install before each build. The site remains self-contained and the
# website and PDF use byte-identical MathJax without committing third-party
# code. Its Apache-2.0 licence is published beside the bundle at
# javascripts/vendor/mathjax/LICENSE.
extra_javascript = [
  "javascripts/mathjax.js",
  "javascripts/vendor/mathjax/tex-svg-full.js",
]

